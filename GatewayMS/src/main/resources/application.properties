quarkus.application.name=GatewayMS
quarkus.http.port=9000
quarkus.datasource.devservices.enabled=false

# CORS Configuration
quarkus.http.cors=true
quarkus.http.cors.origins=${ALLOWED_ORIGINS:http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,DELETE
quarkus.http.cors.headers=*
quarkus.http.cors.access-control-allow-credentials=true

# Gateway Routing Configuration
# Format: gateway.routes.<service-name>=<target-url>
gateway.routes.user=${USERMS_URL:http://localhost:8080}
gateway.routes.profile=${PROFILEMS_URL:http://localhost:9100}
gateway.routes.appointment=${APPOINTMENTMS_URL:http://localhost:9200}
gateway.routes.pharmacy=${PHARMACYMS_URL:http://localhost:9300}
gateway.routes.media=${MEDIAMS_URL:http://localhost:9400}
gateway.routes.payment=${PAYMENTMS_URL:http://localhost:8086}

# Jackson configuration
quarkus.jackson.fail-on-empty-beans=false

# Security (JWT)
# Note: TokenFilter handles manual validation for now, but we can integrate SmallRye JWT later if needed.