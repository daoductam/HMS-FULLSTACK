quarkus.application.name=UserMS
quarkus.http.port=8080

# Database
quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/userdb}
quarkus.datasource.username=${DB_USERNAME:root}
quarkus.datasource.password=${DB_PASSWORD:TaM123456789@}

# Hibernate
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# Custom properties (kept for migration compatibility)
profilems.url=${PROFILEMS_URL:http://localhost:9100}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# CORS
quarkus.http.cors=true
quarkus.http.cors.origins=${app.cors.allowed-origins}
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS

# JWT configuration (if using SmallRye JWT for automatic verification)

