<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot Phòng Khám</title>

  <!-- Chỉ giữ 1 script -->
  <script type="module" src="./main.js"></script>

  <!-- Tailwind -->
  <link href="https://cdn.tailwindcss.com" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f5f7fb;
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      padding: 10px;
    }

    /* ==== CHAT CONTAINER ==== */
    .chat-container {
      width: 100%;
      max-width: 420px;
      height: 90vh;
      background: #ffffff;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    /* ==== HEADER ==== */
    #chat-header {
      background: #0ea5e9;
      color: white;
      padding: 1rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #chat-header h1 {
      font-size: 1.1rem;
      font-weight: bold;
    }

    /* ==== MESSAGE AREA ==== */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      background: #f8fbfd;
      scroll-behavior: smooth;
    }

    /* Scrollbar */
    #messages::-webkit-scrollbar {
      width: 6px;
    }
    #messages::-webkit-scrollbar-thumb {
      background: #cbd5e0;
      border-radius: 20px;
    }

    /* ==== BUBBLES ==== */
    .message {
      display: flex;
      margin-bottom: 12px;
    }

    .bot-message { justify-content: flex-start; }
    .user-message { justify-content: flex-end; }

    .message-bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.35;
      font-size: 0.95rem;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.08);
    }

    .bot-message .message-bubble {
      background: #ffffff;
      border: 1px solid #dce6ef;
    }

    .user-message .message-bubble {
      background: #0ea5e9;
      color: #fff;
    }

    /* ==== QUICK REPLIES ==== */
    #quick-replies {
      padding: 0.6rem;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
    }

    .quick-reply-btn {
      border: none;
      padding: 6px 12px;
      border-radius: 9999px;
      cursor: pointer;
      font-size: 0.8rem;
      background: #0ea5e9;
      color: white;
      transition: 0.2s;
    }

    .quick-reply-btn:hover {
      opacity: 0.8;
    }

    /* ==== INPUT AREA ==== */
    #input-container {
      padding: 0.75rem;
      background: #ffffff;
      border-top: 1px solid #d6e4f0;
      display: flex;
      gap: 10px;
    }

    #user-input {
      flex: 1;
      border-radius: 9999px;
      padding: 8px 14px;
      border: 2px solid #0ea5e9;
      outline: none;
    }

    #send-btn {
      background: #0ea5e9;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 9999px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.2s;
    }

    #send-btn:hover {
      opacity: 0.85;
    }

    /* MOBILE FIX */
    @media (max-width: 480px) {
      .chat-container {
        border-radius: 0;
        height: 100vh;
        max-width: 100%;
      }

      #messages {
        height: calc(100vh - 200px);
      }
    }
  </style>
</head>

<body>
  <div class="chat-container">
    <div id="chat-header" class="p-4 shadow-md flex items-center gap-3">
      <div class="w-12 h-12 rounded-full flex items-center justify-center text-2xl">🏥</div>
      <div>
        <h1 id="clinic-name" class="font-bold text-lg">Phòng khám thông minh</h1>
        <p class="text-sm opacity-75">Trợ lý ảo</p>
      </div>
    </div>

    <div id="messages"></div>
    <div id="quick-replies"></div>

    <div id="input-container">
      <input type="text" id="user-input" placeholder="Nhập tin nhắn..." />
      <button id="send-btn">Gửi</button>
    </div>
  </div>
</body>
</html>
