apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: hms-pro
data:
  jvm-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "title": "JVM Heap Memory Usage",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "jvm_memory_used_bytes{area=\"heap\", service=~\"$service\"}",
              "legendFormat": "{{service}} - Used",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "jvm_memory_max_bytes{area=\"heap\", service=~\"$service\"}",
              "legendFormat": "{{service}} - Max",
              "range": true,
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 15
              },
              "unit": "decbytes"
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "title": "Process CPU Usage",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "process_cpu_usage{service=~\"$service\"} * 100",
              "legendFormat": "{{service}}",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10
              },
              "unit": "percent",
              "max": 100,
              "min": 0
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "id": 3,
          "title": "JVM Threads Status",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "jvm_threads_live_threads{service=~\"$service\"}",
              "legendFormat": "{{service}} - Live",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "jvm_threads_daemon_threads{service=~\"$service\"}",
              "legendFormat": "{{service}} - Daemon",
              "range": true,
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              },
              "unit": "none"
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "id": 4,
          "title": "Garbage Collection Pause Rate (per sec)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "rate(jvm_gc_pause_seconds_sum{service=~\"$service\"}[5m])",
              "legendFormat": "{{service}} - GC pause sum",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              },
              "unit": "s"
            }
          }
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["hms-pro", "jvm"],
      "templating": {
        "list": [
          {
            "current": {},
            "datasource": { "type": "prometheus", "uid": "Prometheus" },
            "definition": "label_values(jvm_memory_used_bytes, service)",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "name": "service",
            "options": [],
            "query": {
              "query": "label_values(jvm_memory_used_bytes, service)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-15m", "to": "now" },
      "timepicker": {},
      "timezone": "",
      "title": "JVM Overview",
      "uid": "jvm_overview",
      "version": 1,
      "weekStart": ""
    }

  http-metrics.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "title": "HTTP Request Throughput",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "sum(rate(http_server_requests_seconds_count{service=~\"$service\"}[5m])) by (service, status)",
              "legendFormat": "{{service}} [{{status}}]",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10
              },
              "unit": "reqps"
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "title": "HTTP Request Latency (P95)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{service=~\"$service\"}[5m])) by (le, service))",
              "legendFormat": "{{service}}",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              },
              "unit": "s"
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "id": 3,
          "title": "HTTP 5xx Error Rate",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "sum(rate(http_server_requests_seconds_count{status=~\"5..\", service=~\"$service\"}[5m])) by (service)",
              "legendFormat": "{{service}} - 5xx Errors",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 15
              },
              "unit": "reqps"
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "id": 4,
          "title": "HTTP Average Response Time",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "sum(rate(http_server_requests_seconds_sum{service=~\"$service\"}[5m])) by (service) / sum(rate(http_server_requests_seconds_count{service=~\"$service\"}[5m])) by (service)",
              "legendFormat": "{{service}}",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              },
              "unit": "s"
            }
          }
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["hms-pro", "http"],
      "templating": {
        "list": [
          {
            "current": {},
            "datasource": { "type": "prometheus", "uid": "Prometheus" },
            "definition": "label_values(http_server_requests_seconds_count, service)",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "name": "service",
            "options": [],
            "query": {
              "query": "label_values(http_server_requests_seconds_count, service)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-15m", "to": "now" },
      "timepicker": {},
      "timezone": "",
      "title": "HTTP Metrics",
      "uid": "http_metrics",
      "version": 1,
      "weekStart": ""
    }

  kafka-metrics.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "title": "Kafka Consumer Lag (Records)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "sum(kafka_consumer_records_lag{service=~\"$service\"}) by (service, topic)",
              "legendFormat": "{{service}} - {{topic}}",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 15
              },
              "unit": "short"
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "title": "Kafka Consumer Processing Rate",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "sum(rate(kafka_consumer_records_consumed_total{service=~\"$service\"}[5m])) by (service, topic)",
              "legendFormat": "{{service}} - {{topic}}",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              },
              "unit": "ops"
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "id": 3,
          "title": "Kafka Producer Send Rate",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "sum(rate(kafka_producer_record_send_total{service=~\"$service\"}[5m])) by (service)",
              "legendFormat": "{{service}} - Sent",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              },
              "unit": "ops"
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "id": 4,
          "title": "Kafka Producer Error Rate",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "sum(rate(kafka_producer_record_error_total{service=~\"$service\"}[5m])) by (service)",
              "legendFormat": "{{service}} - Errors",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 15
              },
              "unit": "ops"
            }
          }
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["hms-pro", "kafka"],
      "templating": {
        "list": [
          {
            "current": {},
            "datasource": { "type": "prometheus", "uid": "Prometheus" },
            "definition": "label_values(kafka_consumer_records_lag, service)",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "name": "service",
            "options": [],
            "query": {
              "query": "label_values(kafka_consumer_records_lag, service)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-15m", "to": "now" },
      "timepicker": {},
      "timezone": "",
      "title": "Kafka Metrics",
      "uid": "kafka_metrics",
      "version": 1,
      "weekStart": ""
    }
