apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: hms-pro
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: hms-pro
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.1.0
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
            - name: grafana-provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources/prometheus-datasource.yml
              subPath: prometheus-datasource.yml
            - name: grafana-provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards/dashboards-provider.yml
              subPath: dashboards-provider.yml
            - name: grafana-dashboards-jvm
              mountPath: /etc/grafana/dashboards/jvm-overview.json
              subPath: jvm-overview.json
            - name: grafana-dashboards-http
              mountPath: /etc/grafana/dashboards/http-metrics.json
              subPath: http-metrics.json
            - name: grafana-dashboards-kafka
              mountPath: /etc/grafana/dashboards/kafka-metrics.json
              subPath: kafka-metrics.json
      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: grafana-provisioning-datasources
          configMap:
            name: grafana-provisioning-config
            items:
              - key: prometheus-datasource.yml
                path: prometheus-datasource.yml
        - name: grafana-provisioning-dashboards
          configMap:
            name: grafana-provisioning-config
            items:
              - key: dashboards-provider.yml
                path: dashboards-provider.yml
        - name: grafana-dashboards-jvm
          configMap:
            name: grafana-dashboards-config
            items:
              - key: jvm-overview.json
                path: jvm-overview.json
        - name: grafana-dashboards-http
          configMap:
            name: grafana-dashboards-config
            items:
              - key: http-metrics.json
                path: http-metrics.json
        - name: grafana-dashboards-kafka
          configMap:
            name: grafana-dashboards-config
            items:
              - key: kafka-metrics.json
                path: kafka-metrics.json
