apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-config
  namespace: hms-pro
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS userdb;
    CREATE DATABASE IF NOT EXISTS profiledb;
    CREATE DATABASE IF NOT EXISTS appointmentdb;
    CREATE DATABASE IF NOT EXISTS pharmacydb;
    CREATE DATABASE IF NOT EXISTS paymentdb;
    CREATE DATABASE IF NOT EXISTS mediadb;
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-svc
  namespace: hms-pro
  labels:
    app: mysql
spec:
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
  selector:
    app: mysql
  clusterIP: None # Headless service for StatefulSet stable network IDs
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: hms-pro
spec:
  serviceName: mysql-svc
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:

      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hms-secret
                  key: DB_PASSWORD
          ports:
            - containerPort: 3306
              name: mysql
          resources:
            limits:
              cpu: "1000m"
              memory: "1024Mi"
            requests:
              cpu: "250m"
              memory: "512Mi"
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d

      volumes:
        - name: mysql-init
          configMap:
            name: mysql-init-config
        - name: mysql-data
          emptyDir: {}
