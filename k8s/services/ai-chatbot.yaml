apiVersion: v1
kind: Service
metadata:
  name: ai-chatbot-svc
  namespace: hms-pro
  labels:
    app: ai-chatbot
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: ai-chatbot
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-chatbot
  namespace: hms-pro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-chatbot
  template:
    metadata:
      labels:
        app: ai-chatbot
    spec:
      containers:
        - name: ai-chatbot
          image: hms/ai-chatbot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: AI_PROVIDER
              value: "groq"
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hms-secret
                  key: GROQ_API_KEY
            - name: DB_HOST
              value: "mysql-svc"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hms-secret
                  key: DB_PASSWORD
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
